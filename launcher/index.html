<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com https://*.googleapis.com;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
    " />
    <title>SM Engine Launcher</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/logo.svg" />

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/shell.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/views.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/modals.css" />
    <link rel="stylesheet" href="./css/marcetplace.css" />
    <link rel="stylesheet" href="./css/analytics.css" />
    <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
    <div id="app" class="sm-launcher">
        <aside id="sidebar" class="sm-sidebar"></aside>

        <section class="sm-workspace">
            <header id="topbar" class="sm-topbar"></header>

            <main id="view-root" class="sm-content">
                <div class="sm-loading">
                    <img class="sm-loading-logo" src="./assets/icons/logo.svg" alt="SM Engine Logo" />

                    <div>
                        <strong>SM Engine Launcher</strong>
                        <span>Preparing workspace…</span>
                    </div>
                </div>
            </main>
        </section>

        <nav id="mobile-nav" class="sm-mobile-nav" aria-label="Mobile navigation"></nav>
    </div>

    <div id="toast-root" class="sm-toast-root" aria-live="polite"></div>

    <script type="module" src="./src/LauncherApp.js"></script>
</body>

</html>
