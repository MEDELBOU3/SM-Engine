name: Build SM Engine Launcher

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install launcher dependencies
        run: npm ci --prefix launcher

      - name: Build launcher installers
        run: npm run dist:win --prefix launcher

      - name: Publish launcher release
        uses: softprops/action-gh-release@v2
        with:
          name: SM Engine Launcher ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 📦 Available Downloads (Windows 64-bit / x64)

            | Package | Type | Details |
            | :--- | :--- | :--- |
            | **`SM-Engine-Launcher-Setup-*.exe`** | **Installer (Recommended)** | Installs to user profile with Desktop & Start menu shortcuts (No Admin/UAC required). |
            | **`SM-Engine-Launcher-Portable-*.exe`** | **Portable Executable** | Runs immediately without installing anything. |
            | **`SM-Engine-Launcher-*-win-x64.zip`** | **ZIP Archive** | Extract and run from any folder or external drive. |

            ---

            ### 💻 System Requirements
            * **Operating System**: Windows 10 / Windows 11 (64-bit)
            * **Architecture**: x64 (AMD64 / Intel 64)
            * **Disk Space**: ~500 MB for launcher, ~2 GB+ for 3D engine versions
            * **RAM**: 4 GB minimum (8 GB+ recommended)

            ---

            ### 🛡️ Windows Defender SmartScreen Note
            As an open-source release, Windows may display an *"Unrecognized app"* warning on the first run:
            1. Click **More info** (*Plus d'infos* / *Weitere Informationen*)
            2. Click **Run anyway** (*Exécuter quand même* / *Trotzdem ausführen*)
          files: |
            launcher/dist-win/*.exe
            launcher/dist-win/*.zip
            launcher/dist-win/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}